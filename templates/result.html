<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Results</title>
</head>

<body>

    <div class="formbold-main-wrapper">
        <div class="formbold-form-wrapper">
            <div class="formbold-event-wrapper">
                <h3>Comparison Results</h3>
                <div class="formbold-event-details">
                    <h5>Form Details</h5>
                    <ul>
                        <!-- Dynamic content will be injected here -->
                    </ul>
                </div>

                <div class="formbold-event-details">
                    <h5>Parameters Weight</h5>
                    <ul>
                        <!-- Dynamic content will be injected here -->
                    </ul>
                </div>

                <div class="formbold-event-details">
                    <h5>Desired Output</h5>
                    <ul id="desired-output">
                        <!-- Dynamic content will be injected here -->
                    </ul>
                </div>

                <h4>Output</h4>
                <button id="reveal-button" class="formbold-btn" type="button">Reveal Predicted Score</button>
                <p id="predicted-score-output">
                    <!-- Predicted score will display here on button click -->
                </p>

                <!-- Modern Student Information Section -->
                <div class="student-info-modern">
                    <div class="student-info-header">
                        <div class="header-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </div>
                        <div class="header-text">
                            <h5>Student Information</h5>
                            <p>Save your results to our database</p>
                        </div>
                    </div>

                    <div class="student-input-group">
                        <div class="input-wrapper">
                            <label for="student-name" class="modern-label">Full Name</label>
                            <input type="text" id="student-name" class="modern-input" placeholder="Enter your full name"
                                required>
                            <div class="input-underline"></div>
                        </div>

                        <div class="input-wrapper">
                            <label for="student-email" class="modern-label">Email Address</label>
                            <input type="email" id="student-email" class="modern-input" placeholder="Enter your email"
                                required>
                            <div class="input-underline"></div>
                        </div>
                    </div>
                </div>

                <button id="save-to-sheet" class="formbold-btn" type="button" disabled>Submit Results</button>

            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Include constants first -->
    <script src="{{ url_for('static', filename='constants.js') }}"></script>

    <script>
        // Simple toast function
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        document.addEventListener("DOMContentLoaded", function () {
            const data = JSON.parse(localStorage.getItem('data'));
            const result = JSON.parse(localStorage.getItem('result'));
            const desired_targets = data.desired_targets;

            const nameInput = document.getElementById('student-name');
            const emailInput = document.getElementById('student-email');
            const submitButton = document.getElementById('save-to-sheet');

            // Enable/disable submit button based on input validation
            function validateInputs() {
                const nameValid = nameInput.value.trim().length > 0;
                const emailValid = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(emailInput.value.trim());
                submitButton.disabled = !(nameValid && emailValid);
            }

            // Input validation events
            nameInput.addEventListener('input', validateInputs);
            emailInput.addEventListener('input', validateInputs);

            // Visual input states
            function updateInputState(input, isValid) {
                const wrapper = input.closest('.input-wrapper');
                if (input.value.trim() !== '') {
                    wrapper.classList.add('has-value');
                    if (isValid) {
                        wrapper.classList.add('is-valid');
                        wrapper.classList.remove('is-invalid');
                    } else {
                        wrapper.classList.add('is-invalid');
                        wrapper.classList.remove('is-valid');
                    }
                } else {
                    wrapper.classList.remove('has-value', 'is-valid', 'is-invalid');
                }
            }

            nameInput.addEventListener('input', () => updateInputState(nameInput, nameInput.value.trim().length > 0));
            emailInput.addEventListener('input', () => updateInputState(emailInput, /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(emailInput.value.trim())));
            nameInput.addEventListener('focus', () => nameInput.closest('.input-wrapper').classList.add('focused'));
            nameInput.addEventListener('blur', () => nameInput.closest('.input-wrapper').classList.remove('focused'));
            emailInput.addEventListener('focus', () => emailInput.closest('.input-wrapper').classList.add('focused'));
            emailInput.addEventListener('blur', () => emailInput.closest('.input-wrapper').classList.remove('focused'));

            if (data && result) {
                // Populate form details
                const formDetails = document.querySelector('.formbold-event-details:first-of-type ul');
                for (const [key, value] of Object.entries(data.features)) {
                    formDetails.innerHTML += `<li><strong>${key.replace(/_/g, ' ').toUpperCase()}:</strong> ${value}</li>`;
                }

                // Populate weight details
                const weightDetails = document.querySelector('.formbold-event-details:nth-of-type(2) ul');
                for (const [key, value] of Object.entries(data.weight)) {
                    weightDetails.innerHTML += `<li><strong>${key.replace(/_/g, ' ').toUpperCase()}:</strong> ${value}</li>`;
                }

                // Populate desired output with display names from constants.js
                const desiredOutput = document.getElementById('desired-output');
                data.desired_targets.forEach(target => {
                    const displayName = getOutputDisplayName(target);
                    desiredOutput.innerHTML += `<li>${displayName}</li>`;
                });

                // Reveal button functionality
                document.getElementById('reveal-button').addEventListener('click', function () {
                    const predictedScoreOutput = document.getElementById('predicted-score-output');
                    const rawScore = result.predicted_scores[desired_targets];
                    const formattedScore = (rawScore != null) ? parseFloat(rawScore).toFixed(3) : 'N/A';
                    predictedScoreOutput.innerHTML = `
                        <strong>Predicted Score:</strong> ${formattedScore}
                    `;
                    this.style.display = 'none';
                });

                // Submit button functionality
                submitButton.addEventListener('click', async function () {
                    submitButton.disabled = true;
                    submitButton.textContent = 'Submitting...';

                    // Prepare submission data
                    const featureColumns = {};
                    Object.entries(data.features).forEach(([key, value]) => {
                        featureColumns[`${key}_value`] = (value !== null && value !== undefined) ? value : 0;
                    });

                    const weightColumns = {};
                    Object.entries(data.weight).forEach(([key, value]) => {
                        weightColumns[`${key}_weight`] = (value !== null && value !== undefined) ? value : 0;
                    });

                    const predictedScoreColumns = {};
                    Object.entries(result.predicted_scores).forEach(([key, value]) => {
                        predictedScoreColumns[`${key}_predicted`] = (value !== null && value !== undefined) ? value : 0;
                    });

                    const weightedScoreColumns = {};
                    Object.entries(result.weighted_scores).forEach(([key, value]) => {
                        weightedScoreColumns[`${key}_weighted`] = (value !== null && value !== undefined) ? value : 0;
                    });

                    const submissionData = {
                        Student_Name: nameInput.value.trim(),
                        Student_Email: emailInput.value.trim(),
                        ...featureColumns,
                        ...weightColumns,
                        desired_outputs: data.desired_targets.join(", "),
                        ...predictedScoreColumns,
                        ...weightedScoreColumns
                    };

                    try {
                        const response = await fetch('/submit-to-sheet', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(submissionData)
                        });

                        const responseData = await response.json();

                        if (response.ok && responseData.status === 'success') {
                            showToast('Results submitted successfully!', 'success');
                            submitButton.textContent = '✓ Submitted';
                        } else {
                            throw new Error(responseData.message || 'Submission failed');
                        }
                    } catch (error) {
                        showToast(`Error: ${error.message}`, 'error');
                        submitButton.textContent = 'Submit Results';
                        validateInputs(); // Re-enable if inputs are valid
                    }
                });
            }
        });
    </script>
</body>

</html>
